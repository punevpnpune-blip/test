name: Build CloudStream extensions

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages and repository index to the builds branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.provider }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [SupJav, SexTB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Package extension and generate its index entry
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          gradle --no-daemon --stacktrace ":${PROVIDER}:writeCacheEntry"
          mkdir package
          cp "$PROVIDER/build/$PROVIDER.cs3" "package/$PROVIDER.cs3"
          cp "$PROVIDER/build/plugin-entry.json" "package/$PROVIDER.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.provider }}-cs3
          path: package/
          if-no-files-found: error

  assemble:
    name: Assemble CloudStream repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-cs3'
          path: packages
          merge-multiple: true
      - name: Validate packages and assemble the repository index
        run: |
          mkdir dist
          cp packages/SupJav.cs3 packages/SexTB.cs3 dist/
          python3 .github/scripts/stage_repository.py dist packages/SupJav.json packages/SexTB.json
      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-repository
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-cloudstream
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cloudstream-repository
          path: staged
      - name: Update the builds branch
        shell: bash
        run: |
          publish_dir="$RUNNER_TEMP/cloudstream-builds"
          builds_ref="$(git ls-remote --heads origin refs/heads/builds)"
          if [[ -n "$builds_ref" ]]; then
            git fetch --no-tags origin refs/heads/builds
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan builds
          fi

          for file in SupJav.cs3 SexTB.cs3 plugins.json repo.json; do
            cp "staged/$file" "$publish_dir/$file"
          done
          cd "$publish_dir"
          git add --force -- SupJav.cs3 SexTB.cs3 plugins.json repo.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Publish CloudStream extensions from $GITHUB_SHA"
          fi
          git push origin HEAD:refs/heads/builds
